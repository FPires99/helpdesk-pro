name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, fileinfo, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install and build front-end
        run: npm ci && npm run build

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Check dependencies for known vulnerabilities
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high

      - name: Demo data loads in a production install (no dev packages)
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress
          touch database/database.sqlite
          APP_ENV=production php artisan migrate:fresh --seed --force

  docker:
    # Build the deployment image and run it the way Render does (no extra privileges).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t helpdesk-pro .

      - name: Start container without extra privileges
        run: |
          docker run -d --name app -p 8080:8080 \
            --security-opt no-new-privileges --cap-drop ALL \
            -e PORT=8080 -e APP_KEY="$(openssl rand -base64 32)" \
            helpdesk-pro

      - name: App responds
        run: |
          for i in $(seq 1 30); do curl -fs http://localhost:8080/up && break; sleep 2; done
          curl -fs http://localhost:8080/login | grep -q "Try the demo"
          echo "Container is serving the app"

      - name: Container logs
        if: always()
        run: docker logs app
