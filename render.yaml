# One-click deploy on Render (free plan). The demo database is rebuilt every time the service starts.
services:
  - type: web
    name: helpdesk-pro
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_NAME
        value: HelpDesk Pro
      - key: APP_URL
        sync: false
